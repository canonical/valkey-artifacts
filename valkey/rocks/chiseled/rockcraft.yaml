---
name: valkey-chiseled
base: ubuntu@26.04

version: "9.0.4"
summary: Valkey Chiseled ROCK OCI
description: |
  Valkey is an open source (BSD) high-performance key-value datastore.
  This chiseled rock provides a container image for Valkey 9.0 on
  Ubuntu 26.04, aligned with the upstream Docker image.
license: Apache-2.0
platforms:
  amd64:
  arm64:

services:
  valkey:
    override: replace
    startup: enabled
    summary: Start Valkey
    command: /usr/local/bin/docker-entrypoint.sh [ valkey-server ]
    working-dir: /data
    on-success: shutdown
    on-failure: shutdown

environment:
  VALKEY_VERSION: "9.0.4"
  PEBBLE_VERBOSE: "1"

parts:
  valkey:
    plugin: nil
    stage-packages:
      - valkey-server
      - valkey-tools
      - libssl3t64
      - tzdata
    override-stage: |
      craftctl default
      # stay under 80 chars
      lib_path="${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      lib_path="${lib_path}:${CRAFT_STAGE}/usr/lib"
      actual=$(LD_LIBRARY_PATH="${lib_path}" \
        "${CRAFT_STAGE}/usr/bin/valkey-server" --version \
        | grep -oP '(?<=v=)[0-9.]+')
      if [ "$actual" != "$CRAFT_PROJECT_VERSION" ]; then
        echo "ERROR: binary version ($actual) does not match" \
          "declared version ($CRAFT_PROJECT_VERSION)"
        exit 1
      fi
      echo "Version check passed: $actual"
    override-prime: |
      craftctl default
      rm -rf "${CRAFT_PRIME}/etc/valkey"
  user:
    plugin: nil
    overlay-script: |
      groupadd --root "${CRAFT_OVERLAY}" -r valkey --gid=999
      useradd --root "${CRAFT_OVERLAY}" -r -g valkey --uid=999 \
        --home-dir /data --shell /bin/bash valkey
      mkdir -p "${CRAFT_OVERLAY}/data" \
        "${CRAFT_OVERLAY}/run/valkey"
      chmod 1777 "${CRAFT_OVERLAY}/data" \
        "${CRAFT_OVERLAY}/run/valkey"
      chown 999:999 "${CRAFT_OVERLAY}/data" \
        "${CRAFT_OVERLAY}/run/valkey"
  docker-entrypoint:
    plugin: dump
    source: local
    organize:
      docker-entrypoint.sh: usr/local/bin/docker-entrypoint.sh
    override-prime: |
      craftctl default
      chmod 0755 \
        "${CRAFT_PRIME}/usr/local/bin/docker-entrypoint.sh"
