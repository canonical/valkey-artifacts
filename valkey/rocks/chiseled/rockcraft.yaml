---
name: valkey-chiseled
base: ubuntu@26.04

version: "9.0.4"
summary: Valkey Chiseled ROCK OCI
description: |
  This is an OCI image that bundles Valkey together with the metrics exporter
  in order to be used in Operators, providing automated operations
  management from day 0 to day 2 on Valkey, on top of a Virtual Machine cluster
  and K8s cluster. It is an open source, end-to-end, production ready data
  platform on top of cloud native technologies.
license: Apache-2.0
platforms:
  amd64:
  arm64:

entrypoint-command: /usr/local/bin/docker-entrypoint.sh [ valkey-server ]

environment:
  VALKEY_VERSION: "9.0.4"

parts:
  valkey:
    plugin: nil
    stage-snaps:
      - valkey-chiseled/9.0/edge
    stage-packages:
      - libatomic1
      - libssl3t64
      - tzdata
    override-stage: |
      craftctl default
      # stay under 80 chars
      lib_path="${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      lib_path="${lib_path}:${CRAFT_STAGE}/usr/lib"
      actual=$(LD_LIBRARY_PATH="${lib_path}" \
        "${CRAFT_STAGE}/usr/bin/valkey-server" --version \
        | grep -oP '(?<=v=)[0-9.]+')
      if [ "$actual" != "$CRAFT_PROJECT_VERSION" ]; then
        echo "ERROR: binary version ($actual) does not match" \
          "declared version ($CRAFT_PROJECT_VERSION)"
        exit 1
      fi
      echo "Version check passed: $actual"
    override-prime: |
      craftctl default
      rm -rf "${CRAFT_PRIME}/etc/valkey"
      rm -rf "${CRAFT_PRIME}/var/lib/valkey"
      rm -rf "${CRAFT_PRIME}/var/log/valkey"
      rm -rf "${CRAFT_PRIME}/run/sentinel"
  valkey-user:
    plugin: nil
    after:
      - valkey
    overlay-script: |
      set -eux
      if ! grep -q '^valkey:' "${CRAFT_OVERLAY}/etc/passwd"; then
        groupadd -P "${CRAFT_OVERLAY}" -r -g 999 valkey
        useradd -P "${CRAFT_OVERLAY}" -r -g valkey -u 999 valkey
      fi
      mkdir -p "${CRAFT_OVERLAY}/data" \
        "${CRAFT_OVERLAY}/run/valkey"
      chmod 1777 "${CRAFT_OVERLAY}/data" \
        "${CRAFT_OVERLAY}/run/valkey"
      chown 999:999 "${CRAFT_OVERLAY}/data" \
        "${CRAFT_OVERLAY}/run/valkey"
  docker-entrypoint:
    plugin: dump
    source: local
    organize:
      docker-entrypoint.sh: usr/local/bin/docker-entrypoint.sh
    override-prime: |
      craftctl default
      chmod 0755 \
        "${CRAFT_PRIME}/usr/local/bin/docker-entrypoint.sh"
