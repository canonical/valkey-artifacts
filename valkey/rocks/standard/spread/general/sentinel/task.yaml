summary: Valkey rock sentinel test

execute: |
  echo "Running sentinel test..."
  docker exec "${SPREAD_TASK//\//_}" pebble start sentinel
  retry=0
  until docker exec "${SPREAD_TASK//\//_}" \
      valkey-cli -p 26379 sentinel masters 2>/dev/null; do
    retry=$((retry + 1))
    if [ $retry -ge 30 ]; then
      echo "Valkey sentinel did not become ready in time"
      docker logs "${SPREAD_TASK//\//_}" || true
      exit 1
    fi
    sleep 1
  done
  docker exec "${SPREAD_TASK//\//_}" valkey-cli -p 26379 sentinel masters
