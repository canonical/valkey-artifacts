---
name: valkey
base: ubuntu@24.04
version: "7.2.13"
summary: Valkey ROCK OCI
description: |
  This is an OCI image that bundles Valkey together with the metrics exporter
  in order to be used in Operators, providing automated operations
  management from day 0 to day 2 on Valkey, on top of a Virtual Machine cluster
  and K8s cluster. It is an open source, end-to-end, production ready data
  platform on top of cloud native technologies.
license: Apache-2.0
platforms:
  amd64:

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 6676E3F1A76ADBE4488944BF7D1A96D4BF78C79E
    url: |
      https://ppa.launchpadcontent.net/data-platform/prometheus-redis-exporter/ubuntu

services:
  valkey:
    override: replace
    startup: enabled
    summary: Start Valkey
    command: "valkey-server /var/lib/valkey/valkey.conf"
    user: valkey
  sentinel:
    override: replace
    startup: disabled
    summary: Start Valkey Sentinel
    command: "valkey-sentinel /var/lib/valkey/sentinel.conf"
    user: valkey
  redis_exporter:
    override: replace
    startup: enabled
    summary: Start Metrics Exporter
    command: "prometheus-redis-exporter"
    user: valkey

parts:
  valkey:
    plugin: nil
    stage-snaps:
      - valkey/7/edge
    stage-packages:
      - libatomic1
      - openssl
    override-stage: |
      craftctl default
      # stay under 80 chars
      lib_path="${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      lib_path="${lib_path}:${CRAFT_STAGE}/usr/lib"
      actual=$(LD_LIBRARY_PATH="${lib_path}" \
        "${CRAFT_STAGE}/usr/bin/valkey-server" --version \
        | grep -oP '(?<=v=)[0-9.]+')
      if [ "$actual" != "$CRAFT_PROJECT_VERSION" ]; then
        echo "ERROR: binary version ($actual) does not match" \
          "declared version ($CRAFT_PROJECT_VERSION)"
        exit 1
      fi
      echo "Version check passed: $actual"
  valkey-user:
    plugin: nil
    after:
      - valkey
    overlay-script: |
      # Create a user in the $CRAFT_OVERLAY chroot
      groupadd -R $CRAFT_OVERLAY -g  584788 valkey
      useradd -R $CRAFT_OVERLAY -M -r -g valkey -u 584788 valkey
    override-prime: |
      mkdir -p $CRAFT_PRIME/var/lib/valkey
      mkdir -p $CRAFT_PRIME/var/log/valkey
      mkdir -p $CRAFT_PRIME/run/valkey
      mkdir -p $CRAFT_PRIME/run/sentinel
      cp $CRAFT_PRIME/etc/valkey/valkey.conf $CRAFT_PRIME/var/lib/valkey/
      cp $CRAFT_PRIME/etc/valkey/sentinel.conf $CRAFT_PRIME/var/lib/valkey/
      CONF="$CRAFT_PRIME/var/lib/valkey/valkey.conf"
      sed -i -E '/^[[:space:]]*dir[[:space:]]/d' "$CONF"
      echo 'dir /var/lib/valkey' >> "$CONF"
      sed -i -E '/^[[:space:]]*daemonize[[:space:]]/d' "$CONF"
      echo 'daemonize no' >> "$CONF"
      SCONF="$CRAFT_PRIME/var/lib/valkey/sentinel.conf"
      sed -i -E '/^[[:space:]]*dir[[:space:]]/d' "$SCONF"
      echo 'dir /var/lib/valkey' >> "$SCONF"
      sed -i -E '/^[[:space:]]*daemonize[[:space:]]/d' "$SCONF"
      echo 'daemonize no' >> "$SCONF"
      chown -R 584788:584788 $CRAFT_PRIME/var/lib/valkey
      chown -R 584788:584788 $CRAFT_PRIME/var/log/valkey
      chown -R 584788:584788 $CRAFT_PRIME/run/valkey
      chown -R 584788:584788 $CRAFT_PRIME/run/sentinel
  deb-security-manifest:
    plugin: nil
    after:
      - valkey-user
    override-prime: |
      set -x
      mkdir -p $CRAFT_PRIME/usr/share/rocks/
      (echo "# os-release" && cat /etc/os-release \
        && echo "# dpkg-query" \
        && dpkg-query -f '${db:Status-Abbrev},'\
        '${binary:Package},'\
        '${Version},'\
        '${source:Package},'\
        '${Source:Version}\n' -W) \
        > $CRAFT_PRIME/usr/share/rocks/dpkg.query
