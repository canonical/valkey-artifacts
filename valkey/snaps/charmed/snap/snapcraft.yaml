name: valkey-charmed
base: core26
version: "9.0.4"
summary: "Valkey: open source, in memory datastore as a snap"
description: |
  A flexible distributed key-value database that is optimized
  for caching and other realtime workloads. Valkey is an open
  source, in memory datastore released under the BSD-3 Clause License.

confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

lint:
  ignore:
    # false positive: the linter's "libva*so*" pattern (meant for libva,
    # the Video Acceleration API) matches libvalkey_ldap.so by name
    - gpu:
        - usr/lib/valkey/modules/libvalkey_ldap.so

hooks:
  install:
    plugs:
      - mount-observe

package-repositories:
  - type: apt
    components: [main]
    suites: [resolute]
    key-id: 6676E3F1A76ADBE4488944BF7D1A96D4BF78C79E
    url: |
      https://ppa.launchpadcontent.net/data-platform/prometheus-redis-exporter/ubuntu

apps:
  server:
    command: start_valkey.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - mount-observe
      - hardware-observe
  cli:
    command: usr/bin/valkey-cli
    plugs:
      - network
      - mount-observe
      - home
  benchmark:
    command: usr/bin/valkey-benchmark
    plugs:
      - network
      - mount-observe
  check-aof:
    command: usr/bin/valkey-check-aof
    plugs:
      - home
      - mount-observe
  check-rdb:
    command: usr/bin/valkey-check-rdb
    plugs:
      - home
      - mount-observe
  sentinel:
    command: start_sentinel.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - mount-observe
      - hardware-observe
  metrics-exporter:
    command: start_metrics_exporter.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    plugs:
      - network
      - network-bind
      - network-observe
      - mount-observe

parts:
  valkey:
    plugin: nil
    stage-packages:
      - valkey-server
      - valkey-tools
      - valkey-sentinel
      - prometheus-redis-exporter
      - util-linux
    override-stage: |
      craftctl default
      # stay under 80 chars
      lib_path="${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      lib_path="${lib_path}:${CRAFT_STAGE}/usr/lib"
      actual=$(LD_LIBRARY_PATH="${lib_path}" \
        "${CRAFT_STAGE}/usr/bin/valkey-server" --version \
        | grep -oP '(?<=v=)[0-9.]+')
      if [ "$actual" != "$CRAFT_PROJECT_VERSION" ]; then
        echo "ERROR: binary version ($actual) does not match" \
          "declared version ($CRAFT_PROJECT_VERSION)"
        exit 1
      fi
      echo "Version check passed: $actual"

  ldap-module:
    plugin: rust
    source: https://git.launchpad.net/valkey-ldap
    source-type: git
    source-tag: lp-1.1.0
    build-packages:
      - libclang-dev
      - libssl-dev
    override-build: |
      cargo build --release --locked
      # same path as packaging metadata in the valkey-ldap repo
      install -Dm755 \
        "${CRAFT_PART_BUILD}/target/release/libvalkey_ldap.so" \
        "${CRAFT_PART_INSTALL}/usr/lib/valkey/modules/libvalkey_ldap.so"

  wrapper:
    plugin: dump
    source: snap/local
