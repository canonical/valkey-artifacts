summary: Valkey snap logrotate test

execute: |
  log_dir="/var/snap/valkey-charmed/common/var/log/valkey"
  # the install hook points the server at valkey-server.log
  log="$log_dir/valkey-server.log"
  conf="/var/snap/valkey-charmed/current/etc/valkey/logrotate.conf"
  # snapd ships no /snap/bin command for daemon apps, so run the oneshot
  # through the unit its timer triggers
  service="snap.valkey-charmed.logrotate.service"

  echo "Running logrotate with no config..."
  systemctl start "$service"

  echo "Setting up the log dir and config the way the charm does..."
  chown snap_daemon:root "$log_dir"
  chmod 750 "$log_dir"
  cat <<EOF > "$conf"
  $log {
      daily
      maxsize 1k
      rotate 14
      maxage 10
      missingok
      nocreate
      compress
      delaycompress
  }
  EOF
  chmod 644 "$conf"

  grow_log() {
    runuser -u snap_daemon -- \
      sh -c "head -c 2048 /dev/zero | tr '\0' x >> $log"
  }

  echo "Rotating a log past maxsize..."
  grow_log
  systemctl start "$service"
  test -f "$log.1"
  test "$(stat -c %U "$log.1")" = snap_daemon
  test ! -e "$log"

  echo "Checking that Valkey recreates its log..."
  valkey-charmed.cli bgsave
  retry=0
  until [ -f "$log" ]; do
    retry=$((retry + 1))
    if [ $retry -ge 30 ]; then
      echo "Valkey did not recreate $log"
      exit 1
    fi
    sleep 1
  done
  test "$(stat -c %U "$log")" = snap_daemon

  echo "Rotating again to compress the previous log..."
  grow_log
  systemctl start "$service"
  test -f "$log.1"
  test -f "$log.2.gz"
  gzip -t "$log.2.gz"

  echo "Enabling the logrotate timer..."
  snap start --enable valkey-charmed.logrotate
  systemctl list-timers --all | grep snap.valkey-charmed.logrotate.timer
  snap services valkey-charmed.logrotate | grep -E 'logrotate +enabled'
