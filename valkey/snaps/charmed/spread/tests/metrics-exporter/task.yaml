summary: Valkey snap metrics-exporter test

execute: |
  echo "Running default metrics-exporter test..."
  snap start valkey-charmed.metrics-exporter
  retry=0
  until curl -sf http://localhost:9121/metrics 2>/dev/null \
      | grep -q redis_up; do
    retry=$((retry + 1))
    if [ $retry -ge 30 ]; then
      echo "Valkey metrics-exporter did not become ready in time"
      snap logs valkey-charmed.metrics-exporter || true
      exit 1
    fi
    sleep 1
  done
  curl -sf http://localhost:9121/metrics

  echo "Testing metrics-exporter configurability via env file..."
  # Require authentication on the Valkey server
  valkey-charmed.cli config set requirepass secret

  # Create password JSON file for metrics-exporter
  pwd_file="/var/snap/valkey-charmed/current/etc/valkey/metrics-password.json"
  cat <<'EOF' > "$pwd_file"
  {
    "redis://localhost:6379": "secret"
  }
  EOF
  chmod 644 "$pwd_file"

  # Configure metrics-exporter via environment file
  env_file="/var/snap/valkey-charmed/current/etc/valkey/metrics-exporter.env"
  cat <<EOF > "$env_file"
  REDIS_EXPORTER_WEB_LISTEN_ADDRESS=":9122"
  REDIS_PASSWORD_FILE="$pwd_file"
  EOF

  snap restart valkey-charmed.metrics-exporter
  retry=0
  until curl -sf http://localhost:9122/metrics 2>/dev/null \
      | grep -q '^redis_up 1'; do
    retry=$((retry + 1))
    if [ $retry -ge 30 ]; then
      echo "Configured Valkey metrics-exporter did not become ready in time"
      snap logs valkey-charmed.metrics-exporter || true
      exit 1
    fi
    sleep 1
  done
  curl -sf http://localhost:9122/metrics | grep -q '^redis_up 1'
  ! curl -sf http://localhost:9121/metrics 2>/dev/null

  rm -f "$env_file" "$pwd_file"
  valkey-charmed.cli -a secret config set requirepass "" 2>/dev/null || true

restore: |
  rm -f /var/snap/valkey-charmed/current/etc/valkey/metrics-exporter.env
  rm -f /var/snap/valkey-charmed/current/etc/valkey/metrics-password.json
  valkey-charmed.cli -a secret config set requirepass "" 2>/dev/null || true
