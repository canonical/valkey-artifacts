name: charmed-valkey
base: core26
build-base: devel # can be removed once 26.04 was released to `stable`
version: "9.0.3"
summary: "Valkey: open source, in memory datastore as a snap"
description: |
  A flexible distributed key-value database that is optimized
  for caching and other realtime workloads. Valkey is an open
  source, in memory datastore released under the BSD-3 Clause License.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

apps:
  server:
    command: start_valkey.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  cli:
    command: usr/bin/valkey-cli
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  benchmark:
    command: usr/bin/valkey-benchmark
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  check-aof:
    command: usr/bin/valkey-check-aof
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  check-rdb:
    command: usr/bin/valkey-check-rdb
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  sentinel:
    command: start_sentinel.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe
      - home

parts:
  valkey:
    plugin: nil
    stage-packages:
      - valkey-server
      - valkey-tools
      - valkey-sentinel
      - util-linux
    override-build: |
      craftctl default
      cp ${CRAFT_PART_INSTALL}/etc/valkey/valkey.conf ${CRAFT_PART_INSTALL}/etc/valkey.conf
      cp ${CRAFT_PART_INSTALL}/etc/valkey/sentinel.conf ${CRAFT_PART_INSTALL}/etc/sentinel.conf

  wrapper:
    plugin: dump
    source: snap/local
