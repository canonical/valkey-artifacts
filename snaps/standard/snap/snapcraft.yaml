name: valkey
base: core26
version: "9.0.3"
summary: "Valkey: open source, in memory datastore as a snap"
description: |
  A flexible distributed key-value database that is optimized
  for caching and other realtime workloads. Valkey is an open
  source, in memory datastore released under the BSD-3 Clause License.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

apps:
  server:
    command: usr/bin/valkey-server
    daemon: simple
    restart-condition: always
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe
  cli:
    command: usr/bin/valkey-cli
    plugs:
      - network
      - network-bind
      - network-observe
  benchmark:
    command: usr/bin/valkey-benchmark
    plugs:
      - network
      - network-bind
      - network-observe
  check-aof:
    command: usr/bin/valkey-check-aof
    plugs:
      - network
      - network-bind
      - network-observe
  check-rdb:
    command: usr/bin/valkey-check-rdb
    plugs:
      - network
      - network-bind
      - network-observe
  sentinel:
    command: usr/bin/valkey-server --sentinel
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe

parts:
  valkey:
    plugin: nil
    stage-packages:
      - valkey-server
      - valkey-tools
    override-stage: |
      craftctl default
      actual=$(LD_LIBRARY_PATH=${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:${CRAFT_STAGE}/usr/lib ${CRAFT_STAGE}/usr/bin/valkey-server --version | grep -oP '(?<=v=)[0-9.]+')
      if [ "$actual" != "$CRAFT_PROJECT_VERSION" ]; then
        echo "ERROR: binary version ($actual) does not match declared version ($CRAFT_PROJECT_VERSION)"
        exit 1
      fi
      echo "Version check passed: $actual"
