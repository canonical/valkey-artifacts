name: Publish rocks to GHCR

on:
  workflow_call:
  workflow_dispatch:

jobs:
  discover-rocks:
    uses: ./.github/workflows/rocks-discover.yaml

  build:
    name: Build rock | ${{ matrix.rock.name }}
    needs: discover-rocks
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v49.0.2
    with:
      path-to-rock-directory: ${{ matrix.rock.path }}
      artifact-prefix: packed-rock-${{ matrix.rock.name }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: read

  test:
    name: Test rock | ${{ matrix.rock.name }} | ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    needs:
      - discover-rocks
      - build
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
        runner:
          - ubuntu-26.04 # amd64
          - ubuntu-26.04-arm # arm64
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Test rock
        uses: ./.github/actions/test-rock
        with:
          rock-name: ${{ matrix.rock.name }}
          rock-path: ${{ matrix.rock.path }}
          runner: ${{ matrix.runner }}

  # Secscan runs against the same packed-rock artifacts uploaded by the build job
  secscan:
    name: Secscan rocks
    needs:
      - discover-rocks
      - build
      - test
    uses: ./.github/workflows/secscan-scan.yaml
    with:
      artifacts: ${{ needs.discover-rocks.outputs.rocks }}
      artifact-kind: rock
      artifact-prefix: packed-rock
      release-channel: edge
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  publish:
    name: Publish rock  | ${{ matrix.rock.name }}
    needs:
      - discover-rocks
      - build
      - test
      - secscan
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_rock_edge.yaml@v49.0.2
    with:
      path-to-rock-directory: ${{ matrix.rock.path }}
      artifact-prefix: packed-rock-${{ matrix.rock.name }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      packages: write # Needed to publish to GitHub Container Registry
      contents: write # Needed to create git tags
