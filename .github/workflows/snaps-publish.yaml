name: Publish Snap

on:
  workflow_call:
    secrets:
      SNAP_STORE_TOKEN_EDGE:
        required: true
      CRAFT_SOURCE_STORE_CREDENTIALS:
        required: true
      CI_COMMITS_SSH_SIGNING_KEY:
        required: true
      PAT:
        required: true
  workflow_dispatch:

jobs:
  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  build:
    name: Build ${{ matrix.snap.name }} snap | ${{ matrix.runner.platform }}
    runs-on: ${{ matrix.runner.label }}
    needs: discover-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.non-standard-snaps) }}
        runner:
          - label: ubuntu-26.04 # amd64
            platform: amd64
          - label: ubuntu-26.04-arm # arm64
            platform: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install snapcraft and LXD
        run: |
          sudo snap install lxd
          sudo adduser "$USER" lxd
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic --channel=latest/beta
          sudo snap install craft-sd --channel=latest/beta
          sudo snap install bld --edge

      - name: snapcraft pack
        id: pack
        working-directory: ${{ matrix.snap.path }}
        run: sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- CRAFT_SD_ENV=production CI=1 SNAPCRAFT_BUILD_INFO=1 snapcraft pack -v

      - name: Snapcraft logs
        if: ${{ success() || (failure() && steps.pack.outcome == 'failure') }}
        run: cat ~/.local/state/snapcraft/log/*

      - name: Upload snapcraft logs
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapcraft-test-logs-${{ matrix.snap.name }}--platform-${{ matrix.runner.platform }}
          path: ~/.local/state/snapcraft/log/*
          if-no-files-found: ignore
          retention-days: 14

      # Matches the path-in-artifact naming used by data-platform-workflows'
      # release_snap_edge.yaml so publish-snaps can find this artifact.
      - run: touch .empty
      - name: Compute path in artifact
        id: path-in-artifact
        run: |
          path="${{ matrix.snap.path }}"
          path="${path#./}"
          echo "path=${path//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload snap package
        uses: actions/upload-artifact@v7
        with:
          name: packed-snap-${{ matrix.snap.name }}-${{ steps.path-in-artifact.outputs.path }}--platform-${{ matrix.runner.platform }}
          path: |
            ${{ matrix.snap.path }}/*.snap
            .empty
          include-hidden-files: true # For `.empty`
          if-no-files-found: error

  publish:
    name: Publish Snap | ${{ matrix.snap.name }} | 9/edge
    needs:
      - discover-snaps
      - build
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.non-standard-snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_edge.yaml@v50.2.1
    with:
      track: "9"
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    permissions:
      contents: write # Needed to create git tags

  # The store rejects re-uploading an identical binary (upload uniqueness is
  # keyed on binary_sha3_384, independent of channel), so additional tracks
  # cannot be published via another `publish` matrix entry. Instead, promote
  # the build set that `publish` just put live on 9/edge to each additional
  # track without re-uploading.
  release-additional-tracks:
    name: Release Snap | ${{ matrix.snap.name }} | ${{ matrix.track }}/edge
    needs:
      - discover-snaps
      - publish
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.non-standard-snaps) }}
        # Additional tracks the 9/edge revisions are mirrored to. The primary
        # track is published by `publish` above.
        track:
          - "9.1"
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    steps:
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Promote 9/edge revisions to ${{ matrix.track }}/edge
        env:
          SNAP: ${{ matrix.snap.name }}
          TRACK: ${{ matrix.track }}
        run: snapcraft promote "$SNAP" --from-channel 9/edge --to-channel "${TRACK}/edge" --yes

  publish-standard:
    name: Publish standard snap | ${{ matrix.track }}/edge
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        track:
          - "9"
          - "9.1"
    uses: ./.github/workflows/snap-standard-pr-publish.yaml
    with:
      snap-path: valkey/snaps/standard
      channel: ${{ matrix.track }}/edge
      release-branch: release-${{ matrix.track }}-edge
    secrets:
      CRAFT_SOURCE_STORE_CREDENTIALS: ${{ secrets.CRAFT_SOURCE_STORE_CREDENTIALS }}
      CI_COMMITS_SSH_SIGNING_KEY: ${{ secrets.CI_COMMITS_SSH_SIGNING_KEY }}
      PAT: ${{ secrets.PAT }}
