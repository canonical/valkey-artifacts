name: Publish Snap

on:
  workflow_call:
    secrets:
      SNAP_STORE_TOKEN_EDGE:
        required: true
      CRAFT_SOURCE_STORE_CREDENTIALS:
        required: true
      CI_COMMITS_SSH_SIGNING_KEY:
        required: true
      PAT:
        required: true
  workflow_dispatch:

jobs:
  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  build:
    name: Build snap | ${{ matrix.snap.name }}
    needs: discover-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.non-standard-snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v49.0.2
    with:
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
      sd-build: true
      snapcraft-snap-channel: beta
    permissions:
      actions: read
      contents: read

  publish:
    name: Publish Snap | ${{ matrix.snap.name }}
    needs:
      - discover-snaps
      - build
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.non-standard-snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_edge.yaml@v49.0.2
    with:
      track: "9"
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: write # Needed to create git tags

  publish-standard:
    uses: ./.github/workflows/snap-standard-pr-publish.yaml
    needs:
      - build
    with:
      snap-path: valkey/snaps/standard
      channel: 9.1-26.04/edge
      release-branch: release-edge
    secrets:
      CRAFT_SOURCE_STORE_CREDENTIALS: ${{ secrets.CRAFT_SOURCE_STORE_CREDENTIALS }}
      CI_COMMITS_SSH_SIGNING_KEY: ${{ secrets.CI_COMMITS_SSH_SIGNING_KEY }}
      PAT: ${{ secrets.PAT }}
