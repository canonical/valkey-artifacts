name: Publish Snap

on:
  workflow_call:
  workflow_dispatch:

jobs:
  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  build:
    name: Build snap | ${{ matrix.snap.name }}
    needs: discover-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v50.2.1
    with:
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    permissions:
      contents: read

  # Sbomber runs against the same packed-snap artifacts uploaded by the build
  # job, and gates publishing. Unlike the PR path this registers results in the
  # SSDLC scan registry, because these are the snaps about to be released.
  sbomber:
    name: Sbomber scan
    needs:
      - discover-snaps
      - build
    uses: ./.github/workflows/sbomber-scan.yaml
    with:
      artifacts: ${{ needs.discover-snaps.outputs.snaps }}
      artifact-kind: snap
      release-channel: edge
      report-ssdlc: true
    permissions:
      actions: read
      contents: read

  publish:
    name: Publish Snap | ${{ matrix.snap.name }}
    needs:
      - discover-snaps
      - build
      - sbomber
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_edge.yaml@v50.2.1
    with:
      track: "9.0"
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    permissions:
      contents: write # Needed to create git tags
