name: Publish artifacts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 9.0/edge
  workflow_dispatch:

env:
  # Store channel the rocks stage their snaps from. Each rock stages the snap
  # of the same name, so the rock build below picks up the revision published
  # in this same run, once it is live on the channel.
  CHANNEL: 9.0/edge

jobs:
  discover-rocks:
    uses: ./.github/workflows/rocks-discover.yaml

  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  # Standalone rocks (standard & chiseled): publish immediately without waiting for snaps
  publish-standalone-rocks:
    name: Build, test and publish standalone rocks
    needs: discover-rocks
    if: ${{ fromJSON(needs.discover-rocks.outputs.standalone-rocks)[0] != null }}
    uses: ./.github/workflows/rocks-publish.yaml
    with:
      rocks: ${{ needs.discover-rocks.outputs.standalone-rocks }}
    secrets: inherit
    permissions:
      actions: read
      packages: write
      contents: write
      security-events: write

  # 1. Record the revision currently live on the store before publishing (snap-backed rocks only)
  snapshot-current-snap-revisions:
    name: Snapshot current snap revisions
    needs:
      - discover-rocks
      - discover-snaps
    if: ${{ fromJSON(needs.discover-rocks.outputs.snap-backed-rocks)[0] != null }}
    runs-on: ubuntu-26.04
    outputs:
      current-revisions: ${{ steps.current-revisions.outputs.current-revisions }}
    env:
      ROCKS: ${{ needs.discover-rocks.outputs.snap-backed-rocks }}
      SNAPS: ${{ needs.discover-snaps.outputs.snaps }}
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    steps:
      - uses: actions/checkout@v7

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - id: current-revisions
        run: .github/scripts/snapshot-current-snap-revisions.sh

  # 2. Build and publish all snaps to the channel
  publish-snaps:
    name: Publish snaps
    needs:
      - discover-snaps
      - snapshot-current-snap-revisions
    if: ${{ always() && needs.discover-snaps.result == 'success' }}
    uses: ./.github/workflows/snaps-publish.yaml
    secrets: inherit
    permissions:
      contents: write

  # 3. Wait until the snap backing the rock has a newer revision live on the channel
  wait-for-snap-revision:
    name: Wait for new snap revisions
    needs:
      - snapshot-current-snap-revisions
      - publish-snaps
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CURRENT_REVISIONS: ${{ needs.snapshot-current-snap-revisions.outputs.current-revisions }}
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    steps:
      - uses: actions/checkout@v7

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Poll store until newer revisions appear
        run: .github/scripts/wait-for-snap-revisions.sh

  # 4. Build, test, scan and publish snap-backed rocks
  publish-snap-backed-rocks:
    name: Build, test and publish snap-backed rocks
    needs:
      - discover-rocks
      - wait-for-snap-revision
    uses: ./.github/workflows/rocks-publish.yaml
    with:
      rocks: ${{ needs.discover-rocks.outputs.snap-backed-rocks }}
    secrets: inherit
    permissions:
      actions: read # Needed to download rock artifacts for Trivy
      packages: write # Needed to publish to GitHub Container Registry
      contents: write # Needed to create git tags
      security-events: write # Needed for Trivy SARIF upload (rocks-scan)
