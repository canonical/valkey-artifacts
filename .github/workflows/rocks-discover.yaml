name: Discover rocks

on:
  workflow_call:
    outputs:
      rocks:
        description: "Discovered rock path/name list"
        value: ${{ jobs.discover-rocks.outputs.rocks }}

jobs:
  discover-rocks:
    runs-on: ubuntu-26.04
    outputs:
      rocks: ${{ steps.discover.outputs.rocks }}
    steps:
      - uses: actions/checkout@v6

      - id: discover
        run: |
          rocks=$(
            while IFS= read -r yaml; do
              dir="${yaml%/rockcraft.yaml}"
              name=$(yq '.name' "$yaml")
              printf '{"path":"%s","name":"%s"}\n' "$dir" "$name"
            done < <(find . -path '*/rocks/*/rockcraft.yaml') \
            | jq -cs .
          )

          echo "rocks=$rocks" >> "$GITHUB_OUTPUT"
