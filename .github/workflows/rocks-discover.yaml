name: Discover rocks

on:
  workflow_call:
    outputs:
      rocks:
        description: "All discovered rocks"
        value: ${{ jobs.discover-rocks.outputs.rocks }}
      standalone-rocks:
        description: "Rocks without stage-snaps"
        value: ${{ jobs.discover-rocks.outputs.standalone-rocks }}
      snap-backed-rocks:
        description: "Rocks with stage-snaps"
        value: ${{ jobs.discover-rocks.outputs.snap-backed-rocks }}

jobs:
  discover-rocks:
    runs-on: ubuntu-26.04
    outputs:
      rocks: ${{ steps.discover.outputs.rocks }}
      standalone-rocks: ${{ steps.discover.outputs.standalone-rocks }}
      snap-backed-rocks: ${{ steps.discover.outputs.snap-backed-rocks }}
    steps:
      - uses: actions/checkout@v7

      - id: discover
        run: |
          all_discovered=$(
            find . -path '*/rockcraft.yaml' \
              | while read -r rockcraft_file; do
                  path="${rockcraft_file%/rockcraft.yaml}"
                  name=$(yq -r '.name' "$rockcraft_file")
                  has_snaps=$(yq -r '[.parts[].stage-snaps // []] | flatten | length > 0' "$rockcraft_file")
                  jq -n --arg path "$path" --arg name "$name" --argjson has_snaps "$has_snaps" \
                    '{path: $path, name: $name, has_stage_snaps: $has_snaps}'
                done \
              | jq -cs .
          )

          rocks=$(jq -c '[.[] | {path, name}]' <<<"$all_discovered")
          standalone=$(jq -c '[.[] | select(.has_stage_snaps == false) | {path, name}]' <<<"$all_discovered")
          snap_backed=$(jq -c '[.[] | select(.has_stage_snaps == true) | {path, name}]' <<<"$all_discovered")

          echo "rocks=$rocks" >> "$GITHUB_OUTPUT"
          echo "standalone-rocks=$standalone" >> "$GITHUB_OUTPUT"
          echo "snap-backed-rocks=$snap_backed" >> "$GITHUB_OUTPUT"
