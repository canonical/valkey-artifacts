# Build and test rocks against snaps published from a pull request.
# Each rock is retargeted to the PR snap channel, tested on amd64 and arm64,
# uploaded as a packed-rock artifact, then scanned by both Trivy and sbomber
# before the workflow passes.

name: Rock tests on PR

on:
  workflow_call:
    inputs:
      snap-suffix:
        description: Channel suffix appended to each rock's existing stage snap channel (e.g. pr-123).
        required: true
        type: string

jobs:
  discover-rocks:
    uses: ./.github/workflows/rocks-discover.yaml

  test-rocks:
    name: Build and test rock | ${{ matrix.rock.name }} | ${{ matrix.runner.label }}
    runs-on: ${{ matrix.runner.label }}
    needs: discover-rocks
    strategy:
      fail-fast: false
      matrix:
        rock: ${{ fromJSON(needs.discover-rocks.outputs.rocks) }}
        runner:
          - label: ubuntu-26.04 # amd64
            platform: amd64
          - label: ubuntu-26.04-arm # arm64
            platform: arm64
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Point rock stage snaps at PR branch
        env:
          ROCK_NAME: ${{ matrix.rock.name }}
          ROCKCRAFT_FILE: ${{ matrix.rock.path }}/rockcraft.yaml
          SNAP_SUFFIX: ${{ inputs.snap-suffix }}
        run: .github/scripts/retarget-rock-stage-snaps.sh

      - name: Test rock
        uses: ./.github/actions/test-rock
        with:
          rock-name: ${{ matrix.rock.name }}
          rock-path: ${{ matrix.rock.path }}
          runner: ${{ matrix.runner.label }}

      # The spread test builds the rock and we upload the artifact
      - name: Compute path in artifact
        id: path-in-artifact
        run: |
          path="${{ matrix.rock.path }}"
          path="${path#./}"
          echo "path=${path//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload rock for Trivy
        uses: actions/upload-artifact@v7
        with:
          name: packed-rock-${{ matrix.rock.name }}-${{ steps.path-in-artifact.outputs.path }}--platform-${{ matrix.runner.platform }}
          path: ${{ matrix.rock.path }}/*.rock
          if-no-files-found: error

  scan-rocks:
    name: Trivy scan
    needs:
      - discover-rocks
      - test-rocks
    uses: ./.github/workflows/rocks-scan.yaml
    with:
      rocks: ${{ needs.discover-rocks.outputs.rocks }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write

  # No SSDLC report: we never release a PR build.
  sbomber-rocks:
    name: Sbomber scan
    needs:
      - discover-rocks
      - test-rocks
    uses: ./.github/workflows/sbomber-scan.yaml
    with:
      artifacts: ${{ needs.discover-rocks.outputs.rocks }}
      artifact-kind: rock
      report-ssdlc: false
    permissions:
      actions: read
      contents: read
