name: Snap test and publish to a branch on PR

on:
  workflow_call:
    secrets:
      SNAP_STORE_TOKEN_EDGE:
        required: true
      CRAFT_SOURCE_STORE_CREDENTIALS:
        required: true
      CI_COMMITS_SSH_SIGNING_KEY:
        required: true
      PAT:
        required: true

jobs:
  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  test-snaps:
    name: Build and test ${{ matrix.snap.name }} snap | ${{ matrix.runner.platform }}
    runs-on: ${{ matrix.runner.label }}
    needs: discover-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJson(needs.discover-snaps.outputs.snaps) }}
        runner:
          - label: ubuntu-26.04 # amd64
            platform: amd64
          - label: ubuntu-26.04-arm # arm64
            platform: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install snapcraft and LXD
        run: |
          sudo snap install lxd
          sudo adduser "$USER" lxd
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic --channel=latest/beta
          sudo snap install craft-sd --channel=latest/beta
          sudo snap install bld --edge

      - name: snapcraft test
        id: test
        working-directory: ${{ matrix.snap.path }}
        run: sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- CRAFT_SD_ENV=production CI=1 snapcraft test

      - name: Snapcraft logs
        if: ${{ success() || (failure() && steps.test.outcome == 'failure') }}
        run: cat ~/.local/state/snapcraft/log/*

      - name: Upload snapcraft logs
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapcraft-test-logs-${{ matrix.snap.name }}--platform-${{ matrix.runner.platform }}
          path: ~/.local/state/snapcraft/log/*
          if-no-files-found: ignore
          retention-days: 14

      # Matches the path-in-artifact naming used by data-platform-workflows'
      # release_snap_pr.yaml so publish-snaps can find this artifact.
      - run: touch .empty
      - name: Compute path in artifact
        id: path-in-artifact
        run: |
          path="${{ matrix.snap.path }}"
          path="${path#./}"
          echo "path=${path//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload snap package
        uses: actions/upload-artifact@v7
        with:
          name: packed-snap-${{ matrix.snap.name }}-${{ steps.path-in-artifact.outputs.path }}--platform-${{ matrix.runner.platform }}
          path: |
            ${{ matrix.snap.path }}/*.snap
            .empty
          include-hidden-files: true # For `.empty`
          if-no-files-found: error

  # Trivy does not scan snaps, so this is the only scan they get. It does not
  # block publish-snaps, because the PR rocks need the PR snaps first.
  # No SSDLC report: we never release a PR build.
  sbomber-snaps:
    name: Sbomber scan
    needs:
      - discover-snaps
      - test-snaps
    uses: ./.github/workflows/sbomber-scan.yaml
    with:
      artifacts: ${{ needs.discover-snaps.outputs.snaps }}
      artifact-kind: snap
      report-ssdlc: false
      request-sbom: false # SBOM only after publishing
    permissions:
      actions: read
      contents: read

  publish-snaps:
    name: Publish snap to PR branch | ${{ matrix.snap.name }}
    strategy:
      fail-fast: false
      matrix:
        # Excludes the standard 'valkey' snap, which is published separately by
        # publish-standard. Filtering the matrix here (rather than a job-level
        # `if: matrix.snap.name != 'valkey'`) works around
        # https://github.com/actions/runner/issues/1985 — the `matrix` context
        # is not available in a job-level `if`.
        snap: ${{ fromJSON(needs.discover-snaps.outputs.non-standard-snaps) }}
    needs:
      - discover-snaps
      - test-snaps
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_pr.yaml@v50.2.1
    with:
      track: "9"
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    permissions:
      contents: read

  publish-standard:
    needs:
      - test-snaps
    uses: ./.github/workflows/snap-standard-pr-publish.yaml
    with:
      snap-path: valkey/snaps/standard
      channel: 9.1-26.04/edge/pr-${{ github.event.pull_request.number }}
      release-branch: release-pr-${{ github.event.pull_request.number }}
    secrets:
      CRAFT_SOURCE_STORE_CREDENTIALS: ${{ secrets.CRAFT_SOURCE_STORE_CREDENTIALS }}
      CI_COMMITS_SSH_SIGNING_KEY: ${{ secrets.CI_COMMITS_SSH_SIGNING_KEY }}
      PAT: ${{ secrets.PAT }}
