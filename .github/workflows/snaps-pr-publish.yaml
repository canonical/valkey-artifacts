name: Snap test and publish to a branch on PR

on:
  workflow_call:
    secrets:
      SNAP_STORE_TOKEN_EDGE:
        required: true

jobs:
  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  build-snaps:
    name: Build snap | ${{ matrix.snap.name }}
    needs: discover-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v49.0.2
    with:
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: read

  test-snaps:
    name: Test ${{ matrix.snap.name }} snap
    runs-on: ubuntu-latest
    needs: [discover-snaps, build-snaps]
    strategy:
      matrix:
        snap: ${{ fromJson(needs.discover-snaps.outputs.snaps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.snap.name }}-*"
          merge-multiple: true

      - name: Install snap
        run: |
          snap_name=$(grep '^name:' "${{ matrix.snap.path }}/snap/snapcraft.yaml" | awk '{print $2}')
          sudo snap install --dangerous "${{ matrix.snap.path }}/${snap_name}"*.snap

      - name: Test server
        run: |
          snap_name=$(grep '^name:' "${{ matrix.snap.path }}/snap/snapcraft.yaml" | awk '{print $2}')

          if snap services "${snap_name}.server" | grep -q inactive; then
            sudo snap start "${snap_name}.server"
          fi

          retry=0
          until "${snap_name}.cli" ping 2>/dev/null | grep -q PONG; do
            retry=$((retry + 1))
            if [ $retry -ge 30 ]; then
              echo "Valkey server did not become ready in time"
              sudo snap logs "${snap_name}.server" || true
              exit 1
            fi
            sleep 1
          done

          "${snap_name}.cli" info

      - name: Test sentinel
        run: |
          snap_name=$(grep '^name:' "${{ matrix.snap.path }}/snap/snapcraft.yaml" | awk '{print $2}')

          if ! snap services "${snap_name}.sentinel" 2>/dev/null | grep -q inactive; then
            echo "No sentinel service, skipping"
            exit 0
          fi

          sudo snap start "${snap_name}.sentinel"

          retry=0
          until "${snap_name}.cli" -p 26379 sentinel masters 2>/dev/null; do
            retry=$((retry + 1))
            if [ $retry -ge 30 ]; then
              echo "Valkey sentinel did not become ready in time"
              sudo snap logs "${snap_name}.sentinel" || true
              exit 1
            fi
            sleep 1
          done

          "${snap_name}.cli" -p 26379 sentinel masters

  publish-snaps:
    name: Publish snap to PR branch | ${{ matrix.snap.name }}
    needs:
      - discover-snaps
      - build-snaps
      - test-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_pr.yaml@v49.0.2
    with:
      track: 9.0
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: read
