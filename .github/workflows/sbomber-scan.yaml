name: Sbomber SBOM and security scan

# Sends the rocks and snaps we just built to Canonical's SBOM and security scan
# services, using canonical/sbomber. This happens before we publish anything.
#
# Trivy (rocks-scan.yaml) also scans the same files. We keep both because
# sbomber gives us the official SBOM and adds the results to the SSDLC
# registry. It uses Trivy inside, so it does not find different bugs.
#
# We scan all files of one kind in a single job. The service works on them at
# the same time, and we do not have many private-endpoint runners.

on:
  workflow_call:
    inputs:
      artifacts:
        description: List of {name, path} to scan, as JSON.
        required: true
        type: string
      artifact-kind:
        description: What to scan, "rock" or "snap".
        required: true
        type: string
      artifact-prefix:
        description: Start of the name of the artifacts that hold the built files.
        default: ""
        required: false
        type: string
      platforms:
        description: Which CPU types to scan, split by a space.
        default: amd64 arm64
        required: false
        type: string
      release-channel:
        description: Channel name to report to SSDLC, such as edge.
        default: edge
        required: false
        type: string
      report-ssdlc:
        description: |
          Add the results to the SSDLC registry. Keep this false for pull
          requests, because we never release a PR build.
        default: false
        required: false
        type: boolean

# These are not secrets, so we keep them here. You do not need to set anything
# up in the repo. If a repo variable with the same name exists, it wins.
#
# The server only accepts `department` and `team` from a fixed list.
# `data_platform` is not on that list, so the server said no to every request
# (see run 33515106392). The error message tells you the values you can use.
env:
  SBOM_DEPARTMENT: ${{ vars.SBOM_DEPARTMENT || 'charm_engineering' }}
  SBOM_TEAM: ${{ vars.SBOM_TEAM || 'no_sql' }}
  SBOM_EMAIL: ${{ vars.SBOM_EMAIL || 'smail.kourta@canonical.com' }}

jobs:
  sbomber:
    name: Sbomber scan | ${{ inputs.artifact-kind }}
    # These services are inside Canonical. Public runners cannot reach them.
    runs-on: [self-hosted-linux-amd64-noble-private-endpoint-medium]
    timeout-minutes: 360 # `poll --wait` waits for every report
    permissions:
      actions: read # To download the built files
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          command -v yq >/dev/null || sudo snap install yq
          command -v jq >/dev/null || sudo apt-get install -y jq

      - name: Download built ${{ inputs.artifact-kind }}s
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix || format('packed-{0}', inputs.artifact-kind) }}-*--platform-*
          merge-multiple: true
          path: sbomber-pkgs

      - name: Generate sbomber manifest
        # The SBOM_* values come from the `env` block above. Do not add them
        # here again, or the repo variable fallback stops working.
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          ARTIFACT_KIND: ${{ inputs.artifact-kind }}
          PKG_DIR: sbomber-pkgs
          PLATFORMS: ${{ inputs.platforms }}
          RELEASE_CHANNEL: ${{ inputs.release-channel }}
          REPORT_SSDLC: ${{ inputs.report-ssdlc }}
        run: .github/scripts/generate-sbom-manifest.sh

      - name: Run sbomber
        uses: canonical/sbomber/.github/actions/run@9a2491ce50947009415e286a049d438a5363a264
        with:
          manifest: ${{ github.workspace }}/sbom_manifest.yaml
          artifact-name: sbomber-${{ inputs.artifact-kind }}
          poll-timeout: "45" # For each file; keep it below the job timeout
          sbomber-ref: 9a2491ce50947009415e286a049d438a5363a264

      # sbomber passes even when the server rejected every file, so we check.
      - name: Verify every SBOM and scan succeeded
        if: always()
        run: .github/scripts/check-sbomber-state.sh
