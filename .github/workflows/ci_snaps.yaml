name: Build and test snaps

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - 9.0/edge
  workflow_dispatch:

jobs:
  # ── YAML lint ─────────────────────────────────────────────────────────────

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint --no-warnings ./snaps/

  # ── Discover snaps ────────────────────────────────────────────────────────

  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  # ── Build jobs (matrix over discovered snaps) ─────────────────────────────

  build-and-test:
    name: Build and test ${{ matrix.snap.name }} snap
    runs-on: ubuntu-26.04
    needs: discover-snaps
    strategy:
      matrix:
        snap: ${{ fromJson(needs.discover-snaps.outputs.snaps) }}
    steps:
      - uses: actions/checkout@v4

      - name: install snapcraft
        run: |
          sudo snap install lxd
          sudo adduser "$USER" lxd
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic

      - name: snapcraft test
        run: |
          cd ${{ matrix.snap.path }}
          snapcraft test

      - name: Snapcraft logs
        if: ${{ success() || (failure() && steps.snapcraft_test.outcome == 'failure') }}
        run: cat ~/.local/state/snapcraft/log/*
