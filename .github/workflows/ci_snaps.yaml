name: Build and test snaps

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - 9.0-26.04
  workflow_dispatch:

jobs:
  # ── YAML lint ─────────────────────────────────────────────────────────────

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint --no-warnings ./snaps/

  # ── Discover snaps ────────────────────────────────────────────────────────

  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  # ── Build jobs (matrix over discovered snaps) ─────────────────────────────

  build:
    name: Build ${{ matrix.snap.name }} snap
    needs: discover-snaps
    strategy:
      matrix:
        snap: ${{ fromJson(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v49.0.2
    permissions:
      actions: read
      contents: read
    with:
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: ${{ matrix.snap.name }}-valkey

  # ── Test job (matrix over discovered snaps) ───────────────────────────────

  test:
    name: Test ${{ matrix.snap.name }} snap
    runs-on: ubuntu-latest
    needs: [discover-snaps, build]
    strategy:
      matrix:
        snap: ${{ fromJson(needs.discover-snaps.outputs.snaps) }}
    steps:
      - uses: actions/checkout@v4

      # Required until core26 reaches stable channel
      - name: Install core26
        run: sudo snap install core26 --edge

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.snap.name }}-valkey-*
          merge-multiple: true

      - name: Install snap
        run: |
          snap_name=$(grep '^name:' "${{ matrix.snap.path }}/snap/snapcraft.yaml" | awk '{print $2}')
          sudo snap install --dangerous "${{ matrix.snap.path }}/${snap_name}"*.snap

      - name: Test server
        run: |
          snap_name=$(grep '^name:' "${{ matrix.snap.path }}/snap/snapcraft.yaml" | awk '{print $2}')

          if snap services "${snap_name}.server" | grep -q inactive; then
            sudo snap start "${snap_name}.server"
          fi

          retry=0
          until "${snap_name}.cli" ping 2>/dev/null | grep -q PONG; do
            retry=$((retry + 1))
            if [ $retry -ge 30 ]; then
              echo "Valkey server did not become ready in time"
              sudo snap logs "${snap_name}.server" || true
              exit 1
            fi
            sleep 1
          done

          "${snap_name}.cli" info

      - name: Test sentinel
        run: |
          snap_name=$(grep '^name:' "${{ matrix.snap.path }}/snap/snapcraft.yaml" | awk '{print $2}')

          if ! snap services "${snap_name}.sentinel" 2>/dev/null | grep -q inactive; then
            echo "No sentinel service, skipping"
            exit 0
          fi

          sudo snap start "${snap_name}.sentinel"

          retry=0
          until "${snap_name}.cli" -p 26379 sentinel masters 2>/dev/null; do
            retry=$((retry + 1))
            if [ $retry -ge 30 ]; then
              echo "Valkey sentinel did not become ready in time"
              sudo snap logs "${snap_name}.sentinel" || true
              exit 1
            fi
            sleep 1
          done

          "${snap_name}.cli" -p 26379 sentinel masters
